<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1140" viewBox="0 0 1260 1140" role="img" aria-labelledby="title description">
  <title id="title">Kent State University graduate business marketing</title>
  <desc id="description">Overall leads increased 135 percent in 2017 compared with 2016. Organic leads increased 38 percent and paid leads increased 148 percent. Reported ROI was 6.4 times in 2017.</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1"><stop stop-color="#071f3d"/><stop offset="1" stop-color="#123d60"/></linearGradient>
    <linearGradient id="bar" x2="0" y2="1"><stop stop-color="#f4ce66"/><stop offset="1" stop-color="#d9aa36"/></linearGradient>
  </defs>
  <rect width="1260" height="1140" fill="url(#back)"/>
  <circle cx="1250" cy="50" r="330" fill="#fff" opacity=".035"/>
  <circle cx="1210" cy="60" r="230" fill="none" stroke="#fff" opacity=".08"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="104" fill="#f3cd66" font-size="29" letter-spacing="3">KENT STATE UNIVERSITY</text>
    <text x="76" y="212" fill="#fff" font-size="62" font-weight="600" letter-spacing="-2">More interest.</text>
    <text x="76" y="284" fill="#fff" font-size="62" font-weight="600" letter-spacing="-2">More enquiries.</text>
    <text x="76" y="438" fill="#f3cd66" font-size="120" font-weight="600" letter-spacing="-6">+135%</text>
    <text x="76" y="490" fill="#d2dce6" font-size="30">overall leads · 2017 vs. 2016</text>
    <line x1="76" y1="917" x2="1184" y2="917" stroke="#fff" opacity=".25"/>
    <rect x="138" y="625" width="210" height="292" rx="12" fill="url(#bar)"/>
    <rect x="524" y="835" width="210" height="82" rx="12" fill="#7f9bab"/>
    <rect x="910" y="597" width="210" height="320" rx="12" fill="url(#bar)"/>
    <g fill="#fff" font-size="34" text-anchor="middle">
      <text x="243" y="603">+135%</text><text x="629" y="813">+38%</text><text x="1015" y="575">+148%</text>
    </g>
    <g fill="#d2dce6" font-size="27" text-anchor="middle">
      <text x="243" y="967">Overall leads</text><text x="629" y="967">Organic leads</text><text x="1015" y="967">Paid leads</text>
    </g>
    <line x1="76" y1="1020" x2="1184" y2="1020" stroke="#fff" opacity=".16"/>
    <text x="76" y="1080" fill="#fff" font-size="28">6.4× reported ROI · 2017</text>
    <text x="1184" y="1080" text-anchor="end" fill="#d2dce6" font-size="25">SEO · PPC · Conversion</text>
  </g>
</svg>
